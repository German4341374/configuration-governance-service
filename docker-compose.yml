name: configuration-governance-service

services:
  postgres:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run setup:env}
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run setup:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:env}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [governance-edge, governance-internal]

  app:
    build:
      context: .
      target: runtime
    image: configuration-governance-service:0.1.0
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_MODE: ${AUTH_MODE:-demo}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:?Run npm run setup:env}
      SIGNING_KEY: ${SIGNING_KEY:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-262144}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${PORT:-8080}:8080'
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 384m
    networks: [governance-edge, governance-internal]

volumes:
  postgres-data:

networks:
  governance-edge:
    driver: bridge
  governance-internal:
    internal: true
